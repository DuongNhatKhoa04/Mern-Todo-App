name: mern-todo-jenkins

services:
  jenkins:
    build:
      context: ./jenkins
    image: mta-jenkins:production
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
    networks:
      - jenkins-net

networks:
  jenkins-net:
    name: jenkins-net

volumes:
  jenkins-home:
    name: jenkins-home
