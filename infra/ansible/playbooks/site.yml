---
# ============================================================
#  ansible-playbook -i inventory.ini playbooks/site.yml
# ============================================================

- name: "01 · Wait for server to be ready"
  hosts: mta
  gather_facts: false
  tasks:
    - name: Wait for SSH port
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 300

    - name: Gather facts after SSH ready
      ansible.builtin.setup:

- name: "02 · Base system setup"
  hosts: mta
  become: true
  roles:
    - base

- name: "03 · Install Docker"
  hosts: mta
  become: true
  roles:
    - docker

- name: "04 · Install Nginx & Certbot"
  hosts: mta
  become: true
  roles:
    - nginx
