name: CD — Deploy to EC2

on:
  workflow_dispatch:
  # Chạy SAU khi CI hoàn tất trên release/production (build phải xong mới deploy).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [release/production]

concurrency:
  group: cd-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy on EC2
    runs-on: ubuntu-latest
    environment: production
    # Deploy khi: chạy tay, HOẶC CI vừa pass trên đúng commit [tag]production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_commit.message == '[tag]production')
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: github.sha trỏ nhánh mặc định, nên checkout đúng commit của CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve RELEASE_TAG
        id: tag
        run: |
          TAG="production"
          echo "Resolved RELEASE_TAG=$TAG"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on EC2 (shared deploy/deploy.sh)
        env:
          EC2_USER: ${{ vars.EC2_USER || 'github' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/Mern-Todo-App' }}
          ENV_FILE: ${{ vars.ENV_FILE || '/home/secrets/.env' }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' \
             ENV_FILE='${ENV_FILE}' \
             RELEASE_TAG='${RELEASE_TAG}' \
             RELEASE_COMMIT='${RELEASE_COMMIT}' \
             bash -s" < deploy/deploy.sh
