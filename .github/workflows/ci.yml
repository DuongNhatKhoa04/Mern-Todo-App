name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gate:
    name: Check release commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event.head_commit.message == '[tag]production'
    steps:
      - run: echo "Commit hợp lệ, tiếp tục build."

  backend:
    name: Backend — install & syntax check
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax check tất cả file .js
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print \
            | while read -r f; do node --check "$f"; done

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: "false"

  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mta-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t mta-frontend:ci ./frontend
